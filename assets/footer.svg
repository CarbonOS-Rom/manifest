<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 40" width="320" height="40" role="img" aria-label="Made with love by the CarbonOS Team">
  <title>Made by the CarbonOS Team</title>
  <style>
    .txt { fill:#ffffff; }
    .sub { fill:#768390; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
    .f  { font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .hb { fill:#00E5C7; transform-box:fill-box; transform-origin:center; animation:beat 1.6s ease-in-out infinite; }
    @keyframes beat { 0%,100% { transform:scale(1); } 15% { transform:scale(1.25); } 30% { transform:scale(1); } 45% { transform:scale(1.15); } }
  </style>
  <text class="f sub" x="0" y="25">Made with</text>
  <g transform="translate(72,0)"><path class="hb" d="M20.0,9.0 L29.5,14.5 L29.5,25.5 L20.0,31.0 L10.5,25.5 L10.5,14.5 Z"/></g>
  <text class="f sub" x="112" y="25">by the CarbonOS Team</text>
</svg>
