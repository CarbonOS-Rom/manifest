<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="1080" height="480" role="img" aria-label="CarbonOS">
  <title>CarbonOS</title>
  <defs>
    <radialGradient id="glow" cx="540" cy="165" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5C7" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#00E5C7" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#00E5C7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><path d="M72,0 L1008,0 A72,72 0 0,1 1080,72 L1080,408 A72,72 0 0,1 1008,480 L72,480 A72,72 0 0,1 0,408 L0,72 A72,72 0 0,1 72,0 Z"/></clipPath>
  </defs>
  <style>
    .hex  { fill:none; stroke:#fff; stroke-width:10; stroke-linejoin:round;
             stroke-dasharray:468; stroke-dashoffset:0;
             animation:draw-hex 1.4s cubic-bezier(.65,0,.35,1) .2s backwards; }
    .ring { fill:none; stroke:#fff; stroke-width:7;
             stroke-dasharray:251.3; stroke-dashoffset:0;
             animation:draw-ring 1s cubic-bezier(.65,0,.35,1) 1.1s backwards; }
    .node { fill:#fff; transform-box:fill-box; transform-origin:center;
             animation-name:pop, shimmer; animation-duration:.45s, 3s;
             animation-timing-function:cubic-bezier(.34,1.56,.64,1), ease-in-out;
             animation-iteration-count:1, infinite; animation-fill-mode:backwards, none; }
    .word { fill:none; stroke-width:13; stroke-linecap:round; stroke-linejoin:round;
             animation:rise .9s cubic-bezier(.22,1,.36,1) backwards; }
    .carbon { stroke:#fff; animation-delay:1.6s; }
    .os     { stroke:#8A8A8A; animation-delay:1.9s; }
    .glow   { opacity:.8; animation:fade-in 1.2s ease-out 1.2s backwards, breathe 4s ease-in-out 2.4s infinite; }
    @keyframes draw-hex  { from { stroke-dashoffset:468; } }
    @keyframes draw-ring { from { stroke-dashoffset:251.3; } }
    @keyframes pop       { from { transform:scale(0); } }
    @keyframes shimmer   { 0%,100% { fill:#fff; } 50% { fill:#00E5C7; } }
    @keyframes rise      { from { opacity:0; transform:translateY(24px); } }
    @keyframes fade-in   { from { opacity:0; } }
    @keyframes breathe   { 0%,100% { opacity:.8; } 50% { opacity:.35; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>

  <path d="M72,0 L1008,0 A72,72 0 0,1 1080,72 L1080,408 A72,72 0 0,1 1008,480 L72,480 A72,72 0 0,1 0,408 L0,72 A72,72 0 0,1 72,0 Z" fill="#000"/>
  <g clip-path="url(#card)">
    <path class="glow" d="M310,165 A230,230 0 1,1 770,165 A230,230 0 1,1 310,165 Z" fill="url(#glow)"/>
  </g>

  <path class="hex" d="M540,87 L607.5,126 L607.5,204 L540,243 L472.5,204 L472.5,126 Z"/>
  <path class="ring" d="M500,165 A40,40 0 1,1 580,165 A40,40 0 1,1 500,165 Z"/>
    <circle class="node" style="animation-delay:0.55s,2.8s" cx="540" cy="87" r="11"/>
    <circle class="node" style="animation-delay:0.67s,3.3s" cx="607.5" cy="126" r="11"/>
    <circle class="node" style="animation-delay:0.79s,3.8s" cx="607.5" cy="204" r="11"/>
    <circle class="node" style="animation-delay:0.91s,4.3s" cx="540" cy="243" r="11"/>
    <circle class="node" style="animation-delay:1.03s,4.8s" cx="472.5" cy="204" r="11"/>
    <circle class="node" style="animation-delay:1.15s,5.3s" cx="472.5" cy="126" r="11"/>

  <g class="word carbon">
    <path transform="translate(278.7,292) scale(0.62)" d="M68.3,14.6 A40,50 0 1,0 68.3,85.4"/>
    <path transform="translate(345.6,292) scale(0.62)" d="M0,100 L40,0 L80,100 M15,62 L65,62"/>
    <path transform="translate(412.6,292) scale(0.62)" d="M0,100 L0,0 L45,0 A27,27 0 0,1 45,54 L0,54 M40,54 L75,100"/>
    <path transform="translate(476.4,292) scale(0.62)" d="M0,50 L44,50 A25,25 0 0,0 44,0 L0,0 L0,100 L48,100 A25,25 0 0,0 48,50"/>
    <path transform="translate(540.3,292) scale(0.62)" d="M40,0 A40,50 0 1,1 40,100 A40,50 0 1,1 40,0 Z"/>
    <path transform="translate(607.3,292) scale(0.62)" d="M0,100 L0,0 L75,100 L75,0"/>
  </g>
  <g class="word os">
    <path transform="translate(691,292) scale(0.62)" d="M40,0 A40,50 0 1,1 40,100 A40,50 0 1,1 40,0 Z"/>
    <path transform="translate(757.9,292) scale(0.62)" d="M68,18 C60,4 48,0 35,0 C15,0 3,12 3,26 C3,44 20,48 35,51 C52,54 68,58 68,76 C68,90 55,100 35,100 C20,100 7,94 1,82"/>
  </g>
</svg>
